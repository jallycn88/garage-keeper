# 用法：在 GitHub 网页把本文件复制为 .github/workflows/build-fpk.yml 并提交，
# 之后推送 v* 标签（或在 Actions 页手动 Run workflow）即自动打包 fpk。
# 若用命令行推送带 workflow 的文件，令牌需要额外勾选 workflow 权限。
name: build-fpk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependency (icon generation only)
        run: pip install pillow

      - name: Build .fpk
        run: python fnos/build_fpk.py

      - name: Show checksum
        run: cd dist && sha256sum *.fpk

      - uses: actions/upload-artifact@v4
        with:
          name: garage-keeper-fpk
          path: dist/*.fpk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.fpk
